# Generated by archfit config init. Review module names and paths, then read the
# rules: section: each starter rule says what it blocks and when its gate is fail.
# Next: archfit config lint · archfit check · archfit baseline
version: 2

# Balanced-Coupling advisory tuning.
coupling:
  # Minimum severity for a coupling advisory: low|medium|high|critical
  min_severity: medium
  # Clone-only duplicated knowledge: score|advisory (default score)
  duplicated_knowledge: score

languages:
  go:
    enabled: true
  python:
    enabled: auto
  typescript:
    enabled: auto
  rust:
    enabled: auto

# Optional analyzers (deeper facts; opt in deliberately because they can be slow).
# analyzers:
#   scip: { enabled: true }         # symbol-level coupling strength
#   syntax: { enabled: true }       # ast-grep: roles, routes, exported surface
#   clones: { enabled: true }       # cross-module duplication

# Off-gate LLM for config init/update/enrich and analyze/explain --ai-summary.
# The deterministic gate never uses it.
# ai:
#   provider: anthropic   # anthropic | openai | ollama
#   model: claude-opus-4-8
#   base_url: ""          # ollama only

# layers: not inferred. Directory names do not prove a layer, so none is guessed.
# To enforce dependency direction: list layers innermost first (a module may
# import its own layer or an earlier one), set layer: on every module, and
# uncomment the no-layer-back-edges rule under rules:. For example:
# layers:
#   - domain
#   - application
#   - adapter
#   - entrypoint

modules:
  cmd:
    # CLI wiring; 20 commits in 12 months.
    volatility: medium
    paths:
      - "cmd/**"
  pkg_chaos:
    # chaos actions, the product core; 46 commits in 12 months.
    volatility: high
    paths:
      - "pkg/chaos/**"
  pkg_container:
    # container model and client interfaces; 21 commits in 12 months.
    volatility: medium
    paths:
      - "pkg/container/**"
  pkg_runtime:
    # Docker, containerd and Podman adapters follow upstream APIs; 52 commits in 12 months.
    volatility: high
    paths:
      - "pkg/runtime/**"
  pkg_tc:
    # tc command builder; 1 commit in 12 months.
    volatility: low
    paths:
      - "pkg/tc/**"
  pkg_util:
    # small parsing helpers; 4 commits in 12 months.
    volatility: low
    paths:
      - "pkg/util/**"

rules:
  # Catches: a dependency cycle between declared modules (A imports B and B
  # imports A, through any files).
  # gate: fail — none at init, so the first new one blocks archfit check.
  - id: no-module-cycles
    type: module_cycle
    gate: fail
  # Uncomment after declaring layers: (see above). Catches: a module importing a
  # module in a later (outer) layer, e.g. domain code importing an adapter.
  # - id: no-layer-back-edges
  #   type: forbidden_layer_direction
  #   gate: fail
